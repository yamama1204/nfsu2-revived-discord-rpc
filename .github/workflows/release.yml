name: Build & Release Packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (!(Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and
              !(Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and
              !(Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build Extension ZIP & Companion Setup.exe
        shell: pwsh
        run: ./scripts/build_all.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfsu2-revived-rpc-packages
          path: release/*

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
          generate_release_notes: true
